[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "utilitarios-academicos"
version = "0.1.0"
description = "Utilitários para documentos, figuras e referências em trabalhos acadêmicos"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vinícius José Dias" }]
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.23",
    "pillow>=9.0",
]

[project.optional-dependencies]
referencias = ["requests>=2.28", "pandas>=1.5"]
video = ["imageio>=2.31", "imageio-ffmpeg>=0.4", "numpy>=1.23"]
dev = ["pytest>=7"]

[project.scripts]
juntar-documentos = "utilitarios_academicos.pdf.juntar_documentos:main"
converter-para-pdf = "utilitarios_academicos.pdf.converter_para_pdf:main"
criar-mosaico = "utilitarios_academicos.figuras.criar_mosaico:main"
criar-animacao = "utilitarios_academicos.figuras.criar_animacao:main"
organizar-referencias = "utilitarios_academicos.referencias.organizar_referencias:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
